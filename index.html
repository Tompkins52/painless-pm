<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painless Project Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one column under a charcoal bar with a red stripe and tabs; content caps at 1040px; the roll-up table turns into cards under 720px. */
:root{
  --bg:#F6F3F2; --surface:#FFFFFF; --surface-2:#EFEAE9; --line:#E1DAD8; --line-strong:#C9C0BE;
  --fg:#231F20; --fg-muted:#6E6465; --fg-faint:#9A9092;
  --brand:#C41230; --brand-ink:#FFFFFF; --brand-soft:#FBE7EB; --brand-hover:#A80F2A;
  --bar:#231F20; --bar-ink:#FFFFFF; --bar-muted:#B9B1B2;
  --ok:#1E7A3E; --ok-bg:#E1F2E6; --warn:#8A5A00; --warn-bg:#FBEFCF; --bad:#A80F2A; --bad-bg:#FBE1E6;
  --shadow:0 1px 2px rgba(35,31,32,.05),0 6px 20px rgba(35,31,32,.06);
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171415; --surface:#201C1D; --surface-2:#2A2526; --line:#3A3335; --line-strong:#4D4547;
    --fg:#F3EEED; --fg-muted:#AEA4A6; --fg-faint:#7E7577;
    --brand:#E03A55; --brand-ink:#FFFFFF; --brand-soft:#3A1A22; --brand-hover:#F05570;
    --bar:#0F0D0E; --bar-ink:#FFFFFF; --bar-muted:#A39A9B;
    --ok:#6FCF8E; --ok-bg:#17301F; --warn:#F2C14E; --warn-bg:#3A2E0F; --bad:#FF7A8E; --bad-bg:#46151F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171415; --surface:#201C1D; --surface-2:#2A2526; --line:#3A3335; --line-strong:#4D4547;
  --fg:#F3EEED; --fg-muted:#AEA4A6; --fg-faint:#7E7577;
  --brand:#E03A55; --brand-ink:#FFFFFF; --brand-soft:#3A1A22; --brand-hover:#F05570;
  --bar:#0F0D0E; --bar-ink:#FFFFFF; --bar-muted:#A39A9B;
  --ok:#6FCF8E; --ok-bg:#17301F; --warn:#F2C14E; --warn-bg:#3A2E0F; --bad:#FF7A8E; --bad-bg:#46151F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:inherit}
button{font:inherit}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted)}
.muted{color:var(--fg-muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-top:4px solid var(--brand)}
.top-inner{max-width:1040px;margin:0 auto;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 24px}
.brand{display:flex;align-items:center;gap:10px;padding-block:12px;min-width:0}
.mark{width:30px;height:30px;border-radius:4px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 15px var(--font-display);flex:0 0 auto}
.brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-text .eyebrow{color:var(--bar-muted)}
.brand-text .name{font:700 18px/1.1 var(--font-display);color:var(--bar-ink);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;color:var(--bar-muted);font:600 14px var(--font-body);padding:12px 12px 13px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--bar-ink)}
.tab[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--brand)}
.tab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
@media (max-width:640px){
  .tabs{margin-left:0;width:100%}
  .brand-text .name{font-size:16px}
}

.banner{max-width:1040px;margin:16px auto 0;padding:10px 14px;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:500}
.banner-wrap{padding-inline:16px}
.main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:24px 72px}

/* generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card + .card{margin-top:16px}
.card h2{margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 .count{font:500 13px var(--font-body);color:var(--fg-muted);letter-spacing:0}
.stack{display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin-top:4px}

/* buttons */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--radius);padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn-danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:6px 10px;font-size:13px;min-height:32px}
.btn-link{border:0;background:none;color:var(--brand);padding:0;min-height:0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg-muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--bar);border-color:var(--bar);color:var(--bar-ink)}
.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill.g{background:var(--ok-bg);color:var(--ok)}
.pill.a{background:var(--warn-bg);color:var(--warn)}
.pill.r{background:var(--bad-bg);color:var(--bad)}
.pill.help{background:var(--brand);color:var(--brand-ink)}
.pill.help::before{background:var(--brand-ink)}
.pill.n{background:var(--surface-2);color:var(--fg-muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--surface-2);color:var(--fg-muted)}
.badge.closed{background:var(--bar);color:var(--bar-ink)}
.badge.hold{background:var(--warn-bg);color:var(--warn)}
.stale{color:var(--warn);font-weight:500}

/* forms */
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.block legend{font:700 18px/1.2 var(--font-display);margin-bottom:4px;float:left;width:100%}
.block .lede-hint{clear:both;margin:0 0 14px;color:var(--fg-muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;min-width:0}
label.f .req{font-weight:500;color:var(--fg-faint);font-size:12px;margin-left:6px}
label.f .opt{font-weight:500;color:var(--fg-faint);font-size:12px;margin-left:6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.45}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
input::placeholder,textarea::placeholder{color:var(--fg-faint)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack-f{display:flex;flex-direction:column;gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{font-size:13px;font-weight:400;color:var(--fg-muted)}
.choice{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.choice-q{display:block;font-weight:600;font-size:14px}
.choice .hint{display:block;margin:2px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.seg span{display:inline-block;padding:9px 18px;font-weight:600;font-size:14px;cursor:pointer;color:var(--fg-muted);background:var(--surface);border-right:1px solid var(--line-strong);min-width:64px;text-align:center}
.seg label:last-child span{border-right:0}
.seg input:checked + span{background:var(--bar);color:var(--bar-ink)}
.seg input:focus-visible + span{outline:2px solid var(--brand);outline-offset:-2px}
.sub{margin-top:12px}
.gate{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.gate-meter{min-width:220px;flex:0 1 280px}
.gate-meter .num{display:block;font-size:13px;color:var(--fg-muted);margin-top:6px;font-weight:500}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand);width:0;transition:width .25s ease}
.meter.ok span{background:var(--ok)}
@media (prefers-reduced-motion:reduce){.meter span{transition:none}}
.missing{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:10px 14px;font-size:14px;margin-bottom:12px}
.missing ul{margin:4px 0 0;padding-left:18px}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ms-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px 36px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ms-row:last-of-type{border-bottom:0}
.ms-row.charter{grid-template-columns:minmax(0,1fr) 150px 36px}
.ms-row input[type=text],.ms-row input[type=date]{min-height:38px;padding:7px 10px;font-size:14px}
.ms-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);margin:0 auto}
.ms-row.done input[type=text]{text-decoration:line-through;color:var(--fg-muted)}
.ms-row .x{appearance:none;border:0;background:none;color:var(--fg-faint);font-size:20px;line-height:1;cursor:pointer;width:36px;height:36px;border-radius:var(--radius)}
.ms-row .x:hover{background:var(--surface-2);color:var(--bad)}
.ms-row .x:focus-visible{outline:2px solid var(--brand)}
.ms-row.over input[type=date]{border-color:var(--bad);color:var(--bad)}
@media (max-width:560px){
  .ms-row{grid-template-columns:28px minmax(0,1fr) 36px}
  .ms-row.charter{grid-template-columns:minmax(0,1fr) 36px}
  .ms-row input[type=date]{grid-column:2 / span 1}
  .ms-row.charter input[type=date]{grid-column:1}
  .ms-row .x,.ms-row span:last-child{grid-row:1;grid-column:3}
  .ms-row.charter .x{grid-column:2}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:50;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--bad);color:#fff}

/* how it works */
.hero{max-width:720px;margin-bottom:28px}
.hero h1{font-size:36px;font-weight:800;margin:6px 0 12px}
.hero .lede{font-size:17px;color:var(--fg-muted);max-width:62ch}
@media (max-width:640px){.hero h1{font-size:28px}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:8px}
.step-n{font:800 13px var(--font-display);color:var(--brand-ink);background:var(--brand);width:28px;height:28px;border-radius:4px;display:grid;place-items:center}
.step h2{font-size:20px}
.step p{font-size:14px}
.house{color:var(--fg-muted);font-style:italic;font-size:13px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:640px){.terms{grid-template-columns:1fr}}
.term{background:var(--surface-2);border-radius:var(--radius);padding:14px 16px;font-size:14px}
.term strong{display:block;font-family:var(--font-display);font-size:15px;margin-bottom:2px}
.board-note{margin-top:16px;font-size:14px;color:var(--fg-muted)}

/* project list */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;color:inherit;min-width:0}
.pcard:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.pcard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pcard-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard-dept{font-size:12px;font-weight:600;color:var(--fg-muted)}
.pcard h3{font-size:17px;overflow-wrap:anywhere}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:32px 20px;text-align:center}
.empty p{max-width:48ch;margin:6px auto 0;color:var(--fg-muted)}

/* project page */
.crumbs{font-size:13px;color:var(--fg-muted);margin-bottom:12px}
.crumbs a{color:var(--brand);text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.phead h1{margin:4px 0;overflow-wrap:anywhere}
.phead-right{display:flex;flex-direction:column;gap:6px;min-width:180px}
.phead-right label{font-size:12px;font-weight:600;color:var(--fg-muted)}
.health{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.hcell{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.hcell .hl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
.hcell .why{font-size:12px;color:var(--fg-muted);overflow-wrap:anywhere}
@media (max-width:760px){.health{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.col .card + .card{margin-top:0}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog span{display:block;height:100%;background:var(--ok)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.calc div{background:var(--surface-2);border-radius:var(--radius);padding:10px 12px}
.calc .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);display:block}
.calc .v{font:600 18px var(--font-display);font-variant-numeric:tabular-nums}
.calc .v.bad{color:var(--bad)}
.calc .v.ok{color:var(--ok)}
@media (max-width:560px){.calc{grid-template-columns:1fr}}
.qa{display:flex;flex-direction:column;gap:12px}
.qa .q{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);display:block;margin-bottom:2px}
.qa .a{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--fg-muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.upd{display:flex;flex-direction:column;gap:10px}
.upd-item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.upd-item:first-child{border-top:0;padding-top:0}
.upd-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--fg-muted)}
.upd-note{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.upd-help{font-size:14px;color:var(--brand);font-weight:600;overflow-wrap:anywhere}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand);margin:0}
.danger{border-color:var(--bad-bg)}
.danger p{font-size:14px;color:var(--fg-muted);margin-bottom:10px}
.suggest{font-size:12px;color:var(--fg-muted);margin-top:4px}

/* roll-up */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);display:block}
.tile .v{font:700 24px/1.2 var(--font-display);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.tile .s{font-size:12px;color:var(--fg-muted);display:block}
.tile.alert .v{color:var(--bad)}
.tile.warn .v{color:var(--warn)}
.rfilters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rfilters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--fg-muted)}
.rfilters select{min-height:40px;padding:7px 10px;font-size:14px;width:auto;min-width:160px}
.summary p{font-size:15px;line-height:1.55}
.summary .sum-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.summary .sum-head h2{margin:0}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--surface-2)}
td.name{font-weight:600;min-width:160px}
td.name .sub{display:block;font-size:12px;font-weight:400;color:var(--fg-muted);margin-top:2px}
td .where{display:block;font-size:12px;color:var(--fg-muted);max-width:28ch}
td.num{text-align:right;white-space:nowrap}
td.upd{white-space:nowrap}
th.num{text-align:right}
@media (max-width:720px){
  .tbl-wrap{background:transparent;border:0;overflow:visible}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px}
  td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:5px 0;border-bottom:0;text-align:right}
  td::before{content:attr(data-l);color:var(--fg-muted);font-size:12px;font-weight:600;flex:0 0 auto;text-align:left;padding-top:2px}
  td.name{display:block;text-align:left;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
  td.name::before{display:none}
  td .where{max-width:none;text-align:right}
  td.num{text-align:right}
}
/* password gate (public build) */
.gate-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px}
.gate-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.gate-box .mark{width:36px;height:36px;font-size:18px}
.gate-box h1{font-size:20px}
.gate-box p{font-size:14px;color:var(--fg-muted)}
.gate-err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin:0}
.csvbox{margin-top:12px}
.csvbox textarea{font-family:var(--font-mono);font-size:12px;min-height:160px}
</style>
</head>
<body>

<div id="gate" class="gate-screen">
  <form class="gate-box" id="gate-form" novalidate>
    <div class="mark" aria-hidden="true">P</div>
    <h1>Painless Project Management</h1>
    <p>Aftersales Parts. Enter the password to continue.</p>
    <label class="f">Password<input type="password" id="gate-pw" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <p class="gate-err" id="gate-err" aria-live="polite"></p>
    <button type="submit" class="btn btn-primary">Enter</button>
  </form>
</div>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="mark" aria-hidden="true">P</div>
      <div class="brand-text">
        <span class="eyebrow">AGCO Aftersales Parts</span>
        <span class="name">Painless Project Management</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-tab="how">How it works</button>
      <button class="tab" data-tab="start">Start a project</button>
      <button class="tab" data-tab="projects">Projects</button>
      <button class="tab" data-tab="report">Roll-up</button>
    </nav>
  </div>
</header>
<div class="banner-wrap"><div id="banner" class="banner" hidden></div></div>
<main class="main" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ---------- helpers ----------
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var DEPTS = ['Distribution & Logistics', 'Marketing', 'Sales & Dealer Programs', 'Pricing', 'Demand Fulfillment', 'Product Support', 'Facilities & IT', 'Other'];
  var CER_STATUS = ['Not started', 'Submitted', 'Approved'];
  var CLM_STATUS = ['Not started', 'In CLM', 'Signed'];
  var STATUSES = ['Active', 'On hold', 'Closed'];
  var SCHED = { green: 'On track', amber: 'At risk', red: 'Off track' };
  var BUDG = { green: 'On budget', amber: 'At risk', red: 'Over budget' };
  var MAX_MS = 8;
  var STALE_DAYS = 14;
  var EXAMPLES = [
    { id: 'pexamplevlm', name: 'Example: Vertical lift module install', dept: 'Distribution & Logistics', lead: 'Example Lead', sponsor: 'Example Sponsor', why: 'Small-parts pick density and throughput are capped by shelving and walk time. Error rate on small parts is above target.', what: 'Install and commission a modular vertical lift module with pick-to-light, integrated with the WMS.', benefit: 'Faster picks, fewer errors, floor space back. Measured by picks per hour and error rate before and after go-live.', start: '2026-03-02', end: '2026-11-20', budget: 850000, spent: 610000, forecast: 840000, cerRequired: true, cerNumber: 'CER-EXAMPLE-01', cerStatus: 'Approved', clmRequired: true, clmWith: 'VLM vendor: install and commissioning SOW', clmStatus: 'Signed', strategy: '', status: 'Active', outcome: '', milestones: [{ id: 'm1', name: 'Vendor SOW signed', due: '2026-03-13', done: true }, { id: 'm2', name: 'Floor prep and power', due: '2026-05-15', done: true }, { id: 'm3', name: 'Modules delivered', due: '2026-07-24', done: true }, { id: 'm4', name: 'Installation and commissioning', due: '2026-09-18', done: true }, { id: 'm5', name: 'Go-live with pick-to-light', due: '2026-10-16', done: false }, { id: 'm6', name: 'Post go-live review', due: '2026-11-20', done: false }], updates: [{ at: '2026-09-25T15:00:00.000Z', schedule: 'green', budget: 'green', help: false, where: '', note: 'Commissioning complete. Operator training this week; go-live on schedule.', by: 'Example Lead' }], createdAt: '2026-02-20T15:00:00.000Z', updatedAt: '2026-09-25T15:00:00.000Z', example: true },
    { id: 'pexamplepromo', name: 'Example: Q4 dealer parts promotion', dept: 'Marketing', lead: 'Example Lead', sponsor: 'Example Sponsor', why: 'Q4 parts volume is soft and dealers want a reason to stock up before the season.', what: 'Run a six-week promotion on filters and wear parts across the dealer network with co-branded materials.', benefit: 'Incremental Q4 parts revenue, measured against last year for the same SKUs.', start: '2026-08-17', end: '2026-12-11', budget: 120000, spent: 95000, forecast: 135000, cerRequired: false, cerNumber: '', cerStatus: 'Not required', clmRequired: true, clmWith: 'Print and fulfillment vendor', clmStatus: 'In CLM', strategy: '', status: 'Active', outcome: '', milestones: [{ id: 'm1', name: 'Promo SKUs and pricing approved', due: '2026-09-18', done: false }, { id: 'm2', name: 'Dealer materials shipped', due: '2026-10-09', done: false }, { id: 'm3', name: 'Promotion live', due: '2026-10-19', done: false }, { id: 'm4', name: 'Results readout', due: '2026-12-11', done: false }], updates: [{ at: '2026-09-26T15:00:00.000Z', schedule: 'amber', budget: 'amber', help: true, where: 'Pricing approval for the promo SKUs by Oct 10, or the materials miss the print window.', note: 'Vendor contract is in CLM. Print cost came in higher than quoted.', by: 'Example Lead' }], createdAt: '2026-08-10T15:00:00.000Z', updatedAt: '2026-09-26T15:00:00.000Z', example: true },
    { id: 'pexamplepdc', name: 'Example: West Coast distribution center opening', dept: 'Distribution & Logistics', lead: 'Example Lead', sponsor: 'Example Sponsor', why: 'West Coast dealers were served from too far away; transit time and freight cost were out of line with the rest of the network.', what: 'Lease, fit out, staff, and stock a parts distribution center on the West Coast, and cut dealers over to it.', benefit: 'Shorter transit to West Coast dealers and lower outbound freight cost per order.', start: '2025-06-02', end: '2026-08-28', budget: 2000000, spent: 1950000, forecast: 1950000, cerRequired: true, cerNumber: 'CER-EXAMPLE-02', cerStatus: 'Approved', clmRequired: true, clmWith: 'Landlord lease; racking and MHE vendors', clmStatus: 'Signed', strategy: '', status: 'Closed', outcome: 'Facility open and shipping. Freight and transit targets to be confirmed after one full quarter of data.', milestones: [{ id: 'm1', name: 'Lease signed', due: '2025-07-31', done: true }, { id: 'm2', name: 'Racking and MHE installed', due: '2026-01-30', done: true }, { id: 'm3', name: 'Team hired and trained', due: '2026-04-24', done: true }, { id: 'm4', name: 'Inventory stocked', due: '2026-07-10', done: true }, { id: 'm5', name: 'Dealers cut over', due: '2026-08-28', done: true }], updates: [{ at: '2026-08-28T15:00:00.000Z', schedule: 'green', budget: 'green', help: false, where: '', note: 'Cutover complete. Closing the project.', by: 'Example Lead' }], createdAt: '2025-05-15T15:00:00.000Z', updatedAt: '2026-08-28T15:00:00.000Z', example: true }
  ];

  var App = {
    store: null, storeKind: 'none', projects: [], ready: false, readOnly: false,
    view: 'how', pid: null, listStatus: 'Active', rDept: '', rStatus: 'Active',
    editCharter: false, confirmDelete: false, csvOpen: false, myName: ''
  };

  // ---------- dates and money ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) {
    if (!s) return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) return null;
    return Date.UTC(+m[1], +m[2] - 1, +m[3]);
  }
  function daysBetween(a, b) {
    var A = parseISO(a), B = parseISO(b);
    if (A == null || B == null) return null;
    return Math.round((B - A) / 86400000);
  }
  function fmtDate(s) {
    var t = parseISO(s);
    if (t == null) return '';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  }
  function fmtShort(s) {
    var t = parseISO(s);
    if (t == null) return '';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  }
  function daysAgo(iso) {
    if (!iso) return null;
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    return Math.max(0, Math.floor((Date.now() - t) / 86400000));
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function money(n) {
    n = num(n);
    return (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
  }
  function moneyShort(n) {
    n = num(n);
    var a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
    if (a >= 1e3) return s + '$' + Math.round(a / 1e3) + 'K';
    return s + '$' + Math.round(a);
  }
  function signed(n) { n = num(n); return (n >= 0 ? '+' : '-') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US'); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  // ---------- health ----------
  function openMilestones(p) { return (p.milestones || []).filter(function (m) { return !m.done; }); }
  function nextMilestone(p) {
    var open = openMilestones(p).filter(function (m) { return m.due; });
    open.sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
    return open[0] || null;
  }
  function scheduleSuggestion(p) {
    if (p.status === 'Closed') return { rag: 'green', why: 'Closed' };
    var ms = p.milestones || [];
    if (!ms.length) return { rag: 'amber', why: 'No milestones yet' };
    var today = todayISO(), open = openMilestones(p), worst = 0;
    open.forEach(function (m) { var d = daysBetween(m.due, today); if (d != null && d > worst) worst = d; });
    var pastEnd = daysBetween(p.end, today);
    if (worst > 14) return { rag: 'red', why: 'A milestone is ' + worst + ' days overdue' };
    if (pastEnd != null && pastEnd > 0 && open.length) return { rag: 'red', why: 'Past the end date with open milestones' };
    if (worst > 0) return { rag: 'amber', why: 'A milestone is ' + plural(worst, 'day', 'days') + ' overdue' };
    if (!open.length) return { rag: 'green', why: 'All milestones done' };
    return { rag: 'green', why: 'Milestones on schedule' };
  }
  function budgetSuggestion(p) {
    var approved = num(p.budget), spent = num(p.spent), fc = num(p.forecast);
    if (!approved) return { rag: 'amber', why: 'No approved budget' };
    var base = fc > 0 ? fc : spent, ratio = base / approved;
    if (spent > approved * 1.0001 || ratio > 1.10) return { rag: 'red', why: 'Forecast ' + money(base) + ' against ' + money(approved) + ' approved' };
    if (ratio > 1.0) return { rag: 'amber', why: 'Forecast over approved by ' + money(base - approved) };
    return { rag: 'green', why: Math.round(ratio * 100) + '% of approved' };
  }
  function latestUpdate(p) { var u = p.updates || []; return u.length ? u[u.length - 1] : null; }
  function health(p) {
    var lu = latestUpdate(p), ss = scheduleSuggestion(p), bs = budgetSuggestion(p);
    var age = lu ? daysAgo(lu.at) : null;
    var active = (p.status || 'Active') === 'Active';
    return {
      schedule: lu ? lu.schedule : ss.rag,
      budget: lu ? lu.budget : bs.rag,
      help: !!(lu && lu.help),
      where: lu ? (lu.where || '') : '',
      age: age,
      stale: active && (age == null || age > STALE_DAYS),
      ss: ss, bs: bs, fromUpdate: !!lu
    };
  }
  function attention(p) {
    var h = health(p), s = 0;
    if (h.help) s += 100;
    s += h.schedule === 'red' ? 30 : h.schedule === 'amber' ? 10 : 0;
    s += h.budget === 'red' ? 30 : h.budget === 'amber' ? 10 : 0;
    if (h.stale) s += 5;
    return s;
  }
  function updatedText(h) {
    if (h.age == null) return 'No update yet';
    if (h.age === 0) return 'Updated today';
    return 'Updated ' + plural(h.age, 'day', 'days') + ' ago' + (h.stale ? ' (gone quiet)' : '');
  }
  function pill(kind, rag) {
    var label = kind === 's' ? SCHED[rag] : BUDG[rag];
    return '<span class="pill ' + (rag === 'green' ? 'g' : rag === 'amber' ? 'a' : 'r') + '">' + (label || rag) + '</span>';
  }
  function statusBadge(p) {
    var s = p.status || 'Active';
    if (s === 'Closed') return '<span class="badge closed">Closed</span>';
    if (s === 'On hold') return '<span class="badge hold">On hold</span>';
    return '';
  }
  function deptOptions(sel) {
    return DEPTS.map(function (d) { return '<option value="' + esc(d) + '"' + (d === sel ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('');
  }
  function options(list, sel) {
    return list.map(function (d) { return '<option value="' + esc(d) + '"' + (d === sel ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('');
  }
  function ragOptions(map, sel) {
    return ['green', 'amber', 'red'].map(function (k) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + map[k] + '</option>'; }).join('');
  }
  function findProject(id) {
    for (var i = 0; i < App.projects.length; i++) if (App.projects[i].id === id) return App.projects[i];
    return null;
  }

  // ---------- stores ----------
  function localStore() {
    var KEY = 'ppm.projects', subs = [];
    function read() {
      try {
        var raw = localStorage.getItem(KEY);
        if (raw == null) { localStorage.setItem(KEY, JSON.stringify(EXAMPLES)); return clone(EXAMPLES); }
        return JSON.parse(raw || '[]');
      } catch (e) { return []; }
    }
    function write(arr) {
      try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch (e) {}
      subs.forEach(function (cb) { cb(clone(arr)); });
    }
    return {
      kind: 'local',
      subscribe: function (cb) { subs.push(cb); setTimeout(function () { cb(read()); }, 0); return function () { subs = subs.filter(function (s) { return s !== cb; }); }; },
      set: function (id, data) { var arr = read().filter(function (p) { return p.id !== id; }); var o = clone(data); o.id = id; arr.push(o); write(arr); return Promise.resolve(); },
      remove: function (id) { write(read().filter(function (p) { return p.id !== id; })); return Promise.resolve(); }
    };
  }

  var chains = {};
  function errMsg(e) {
    var c = e && e.code;
    if (c === 'invalid_argument') return 'Could not save. You may need Contributor access to this page; ask the page owner.';
    if (c === 'quota_exceeded') return 'The project database is full. Delete old projects to make room.';
    if (c === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
    if (c === 'revoked' || c === 'not_granted') return 'Access to the shared database was withdrawn. Reload the page.';
    return 'Could not save. Check your connection and try again.';
  }
  function persist(p) {
    var id = p.id, data = clone(p);
    delete data.id;
    data.updatedAt = new Date().toISOString();
    var copy = clone(data); copy.id = id;
    var i = -1;
    for (var k = 0; k < App.projects.length; k++) if (App.projects[k].id === id) { i = k; break; }
    if (i >= 0) App.projects[i] = copy; else App.projects.push(copy);
    chains[id] = (chains[id] || Promise.resolve()).then(function () { return App.store.set(id, data); }).then(function () { return true; }, function (e) { toast(errMsg(e), true); return false; });
    return chains[id];
  }

  // ---------- toast and banner ----------
  var toastTimer = null;
  function toast(msg, isErr) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, isErr ? 6000 : 2600);
  }
  function updateBanner() {
    var b = $('#banner');
    if (App.readOnly) { b.textContent = 'You have view access. You can read everything here; ask the page owner for Contributor access to add or update projects.'; b.hidden = false; }
    else if (App.storeKind === 'local') { b.textContent = 'Projects are saved in this browser only. Nothing leaves your device.'; b.hidden = false; }
    else b.hidden = true;
  }
  function copyText(text, okMsg) {
    var done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast(okMsg || 'Copied'); }, function () { fallbackCopy(text); });
        done = true;
      }
    } catch (e) {}
    if (!done) fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    toast(ok ? 'Copied' : 'Select the text and copy it yourself', !ok);
  }

  // ---------- views ----------
  function howHTML() {
    var active = App.projects.filter(function (p) { return (p.status || 'Active') === 'Active'; }).length;
    var helps = App.projects.filter(function (p) { return (p.status || 'Active') === 'Active' && health(p).help; }).length;
    var note = !App.ready ? '' :
      '<p class="board-note">On the board right now: ' + plural(active, 'active project', 'active projects') + (helps ? ', ' + helps + ' asking for help' : '') + '. <a href="#report">Open the roll-up.</a></p>';
    return '' +
      '<section class="hero">' +
        '<p class="eyebrow">How it works</p>' +
        '<h1>Run a project without becoming a project manager.</h1>' +
        '<p class="lede">Three steps, one page each. Think of building a house: draw the plans and get the loan before anyone digs, put the big steps on a calendar, and walk the site every week. That is the whole method.</p>' +
        '<div class="cta-row">' + (App.readOnly ? '' : '<button class="btn btn-primary" data-action="go" data-to="start">Start a project</button>') + '<button class="btn" data-action="go" data-to="report">See the roll-up</button></div>' +
      '</section>' +
      '<section class="steps">' +
        '<article class="step"><div class="step-n">1</div><h2>Charter it</h2><p>One page: which department, who sponsors it, who leads it, why, what, what we get, how much, when, CER or not, contract or not. Until the page is complete, it is not a project.</p><p class="house">The house: plans, permit, and the loan.</p></article>' +
        '<article class="step"><div class="step-n">2</div><h2>Run it</h2><p>Keep up to eight milestones current. Keep three money numbers honest: approved, spent, forecast. Post a two-minute update every week: schedule, budget, and whether you need help.</p><p class="house">The house: foundation, framing, roof. Walk the site on Fridays.</p></article>' +
        '<article class="step"><div class="step-n">3</div><h2>Report it</h2><p>Every project rolls up to one view: who needs help and where, what is off track, what is over budget, what has gone quiet. That view is what goes to the executives. Be honest in step 2 and step 3 does itself.</p><p class="house">The house: the inspector walks through.</p></article>' +
      '</section>' +
      '<section class="card rules"><h2>Rules of the road</h2><ul>' +
        '<li><strong>Every project has a sponsor and a lead.</strong> Nobody else needs a title.</li>' +
        '<li><strong>Eight milestones, maximum.</strong> If you need more, it is two projects.</li>' +
        '<li><strong>The weekly update takes two minutes.</strong> Post it on Friday, even when nothing changed.</li>' +
        '<li><strong>Red is not failure.</strong> Hiding red is.</li>' +
        '<li><strong>If you need help, say where.</strong> That is how help finds you.</li>' +
      '</ul>' +
      '<div class="terms">' +
        '<div class="term"><strong>CER</strong>Capital expenditure request. Needed for anything capitalized: equipment, buildouts, systems we will own. Get it moving before the project needs the money, not after.</div>' +
        '<div class="term"><strong>CLM</strong>Contract lifecycle management. Any vendor agreement, statement of work, lease, or service contract goes through Legal here. Flag it on the charter so it is in the schedule, not a surprise.</div>' +
      '</div>' + note + '</section>';
  }

  function msRowCharter(m, i) {
    return '<div class="ms-row charter">' +
      '<input type="text" id="c-ms-name-' + i + '" class="ms-name" placeholder="Milestone, e.g. Vendor SOW signed" value="' + esc(m ? m.name : '') + '" aria-label="Milestone name">' +
      '<input type="date" id="c-ms-due-' + i + '" class="ms-due" value="' + esc(m ? m.due : '') + '" aria-label="Milestone date">' +
      '<button type="button" class="x" data-action="c-rm-ms" aria-label="Remove milestone">&times;</button></div>';
  }

  function charterFormHTML(p) {
    var edit = !!p; p = p || {};
    var deptKnown = DEPTS.indexOf(p.dept) >= 0;
    var deptSel = edit ? (deptKnown ? p.dept : (p.dept ? 'Other' : '')) : '';
    var deptOther = edit && !deptKnown ? (p.dept || '') : '';
    var cer = edit ? (p.cerRequired ? 'yes' : 'no') : '';
    var clm = edit ? (p.clmRequired ? 'yes' : 'no') : '';
    var msRows = '';
    if (!edit) msRows = [0, 1, 2].map(function (i) { return msRowCharter(null, i); }).join('');
    return '' +

  function charterMissing() {
    var v = function (id) { var el = $('#' + id); return el ? String(el.value || '') : ''; };
    var miss = [], total = 12;
    if (!v('c-name').trim()) miss.push('Project name');
    var dept = v('c-dept');
    if (!dept) miss.push('Department');
    else if (dept === 'Other') { total += 1; if (!v('c-deptOther').trim()) miss.push('Department name'); }
    if (!v('c-lead').trim()) miss.push('Project lead');
    if (!v('c-sponsor').trim()) miss.push('Sponsor');
    if (!v('c-why').trim()) miss.push('Why are we doing this');
    if (!v('c-what').trim()) miss.push('What are we going to do');
    if (!v('c-benefit').trim()) miss.push('What do we get');
    if (v('c-budget') === '') miss.push('Approved budget');
    if (!$('input[name="c-cer"]:checked')) miss.push('CER: yes or no');
    if (!$('input[name="c-clm"]:checked')) miss.push('CLM: yes or no');
    if (!v('c-start')) miss.push('Start date');
    if (!v('c-end')) miss.push('Target end date');
    else if (v('c-start') && daysBetween(v('c-start'), v('c-end')) < 0) miss.push('End date comes before the start date');
    return { miss: miss, total: total };
  }
  function charterGate() {
    var f = $('#charter'); if (!f) return;
    var r = charterMissing(), done = Math.max(0, r.total - r.miss.length);
    var meter = $('#c-meter'), wrap = $('#c-meterwrap'), count = $('#c-count');
    if (meter) meter.style.width = Math.round(done / r.total * 100) + '%';
    if (wrap) wrap.className = 'meter' + (r.miss.length ? '' : ' ok');
    if (count) count.textContent = r.miss.length ? done + ' of ' + r.total + ' required answered' : 'Complete. The gate is open.';
    var dw = $('#c-deptOtherWrap'), dsel = $('#c-dept');
    if (dw && dsel) dw.hidden = dsel.value !== 'Other';
    var cerYes = $('#c-cer-yes'), cw = $('#c-cerWrap');
    if (cw) cw.hidden = !(cerYes && cerYes.checked);
    var clmYes = $('#c-clm-yes'), lw = $('#c-clmWrap');
    if (lw) lw.hidden = !(clmYes && clmYes.checked);
    var box = $('#c-missing');
    if (box && !box.hidden) {

    }
  }

        var np = readCharter({});
        np.id = uid('p'); np.status = 'Active'; np.spent = 0; np.forecast = 0; np.outcome = '';
        np.milestones = readCharterMilestones(); np.updates = [];
        np.createdAt = new Date().toISOString();
        persist(np).then(function (ok) { if (ok) toast('Project created. It is on the board.'); });
        location.hash = '#p-' + np.id;
      }
      return;
    }
    if (f.id === 'update-form') {
      e.preventDefault();
      var cp = currentProject(); if (!cp) return;
      var help = !!$('#p-u-help').checked, where = ($('#p-u-where').value || '').trim();
      if (help && !where) { toast('Say where you need help. That is the whole point.', true); $('#p-u-where').focus(); return; }
      var by = ($('#p-u-by').value || '').trim();
      try { if (by) localStorage.setItem('ppm.name', by); } catch (err) {}
      App.myName = by;
      var q6 = clone(cp);
      q6.updates = (q6.updates || []).concat([{ at: new Date().toISOString(), schedule: $('#p-u-sched').value, budget: $('#p-u-bud').value, help: help, where: help ? where : '', note: ($('#p-u-note').value || '').trim(), by: by }]);
      if (q6.updates.length > 60) q6.updates = q6.updates.slice(-60);
      persist(q6).then(function (ok) { if (ok) toast(help ? 'Update posted. The roll-up now shows you need help.' : 'Update posted'); });
      $('#p-u-note').value = ''; $('#p-u-where').value = ''; $('#p-u-help').checked = false;
      render({ preserve: true });
      window.scrollTo(0, 0);
      return;
    }
  }
  function onKey(e) {
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('rowlink')) { location.hash = e.target.getAttribute('data-href'); }
  }

  // ---------- init ----------
  function init() {
    try { App.myName = localStorage.getItem('ppm.name') || ''; } catch (e) {}
    var app = $('#app');
    app.addEventListener('click', onClick);
    app.addEventListener('change', onChange);
    app.addEventListener('input', onInput);
    app.addEventListener('submit', onSubmit);
    app.addEventListener('keydown', onKey);
    $$('.tab').forEach(function (b) { b.addEventListener('click', function () { location.hash = '#' + b.dataset.tab; }); });
    window.addEventListener('hashchange', route);
    route();
    App.store = localStore(); App.storeKind = 'local';
    updateBanner();
    App.store.subscribe(function (list) {
      App.projects = list;
      App.ready = true;
      if (App.view === 'start') return;
      render({ preserve: true });
    });
  }
  // ---------- password gate ----------
  var GATE_KEY = 'ppm.unlocked';
  var PASSWORD = 'gryffindor';
  function isUnlocked() { try { return localStorage.getItem(GATE_KEY) === 'yes'; } catch (e) { return false; } }
  function showGate(start) {
    var g = $('#gate'), f = $('#gate-form'), pw = $('#gate-pw'), err = $('#gate-err');
    g.hidden = false;
    pw.focus();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if ((pw.value || '').trim().toLowerCase() === PASSWORD) {
        try { localStorage.setItem(GATE_KEY, 'yes'); } catch (x) {}
        g.hidden = true;
        start();
      } else {
        err.textContent = 'Wrong house. Try again.';
        pw.value = '';
        pw.focus();
      }
    });
  }
  function boot() {
    if (isUnlocked()) { $('#gate').hidden = true; init(); } else showGate(init);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>

</body>
</html>
